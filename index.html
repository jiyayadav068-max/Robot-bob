<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.O.B. - Exhibition Robot Core</title>
    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #162032;
            --accent-cyan: #06b6d4;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --accent-red: #ef4444;
            --accent-purple: #a855f7;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            text-align: center;
            padding: 14px 0;
            border-bottom: 1px solid #1e293b;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--accent-cyan);
            letter-spacing: 1px;
        }

        header p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid #1e293b;
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--accent-cyan);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 13px 10px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.1s ease;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        button:active {
            transform: scale(0.96);
            opacity: 0.9;
        }

        .btn-cyan { background-color: #0891b2; }
        .btn-blue { background-color: #2563eb; }
        .btn-green { background-color: #059669; }
        .btn-amber { background-color: #d97706; }
        .btn-red { background-color: #dc2626; }
        .btn-purple { background-color: #7c3aed; }
        .btn-slate { background-color: #334155; }

        .file-upload-box {
            border: 2px dashed #334155;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            background-color: #0b1120;
            cursor: pointer;
        }

        .file-upload-box input {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🤖 B.O.B. Exhibition Core</h1>
            <p>Battery Operated Buddy • Guaranteed Deep Robot Voice</p>
        </header>

        <!-- Grand Exhibition Opening & Professional Greetings -->
        <div class="card">
            <div class="card-title">🏆 Official Exhibition Presentation</div>
            
            <button class="btn-purple" style="width: 100%; font-size: 0.95rem; padding: 14px;" onclick="playSpeechSynth('Greetings esteemed judges, respected teachers across all departments, supportive parents, and fellow young innovators! Welcome to our exhibition showcase. I am B.O.B., your automated guide. Our project combines hardware engineering with digital innovation. As future entrepreneurs, we believe in solving real-world challenges—though our primary challenge today is surviving on caffeine and keeping our code bug-free!')">
                🎤 Grand Opening Speech (All Audiences)
            </button>

            <div class="btn-grid">
                <button class="btn-blue" onclick="playSpeechSynth('Welcome esteemed judges! Thank you for evaluating our model. We promise our system architecture is fully optimized and ready for your toughest questions.')">👨‍⚖️ For Judges</button>
                <button class="btn-amber" onclick="playSpeechSynth('Greetings to all our dedicated teachers! Thank you for guiding our education, expanding our perspectives, and teaching us the principles that brought this project to life.')">📚 For Teachers</button>
                <button class="btn-green" onclick="playSpeechSynth('Welcome dear parents! Thank you for your endless patience, transportation, and funding our late-night hardware components.')">❤️ For Parents</button>
                <button class="btn-cyan" onclick="playSpeechSynth('Hello fellow students and young innovators! Welcome to the future of technology. Let us build, code, and disrupt together!')">🚀 For Students</button>
            </div>
        </div>

        <!-- 5-Second Soundtracks & FX -->
        <div class="card">
            <div class="card-title">
                <span>🔊 5-Sec Robot Soundtracks & FX</span>
                <button class="btn-red" style="padding: 5px 10px; font-size: 0.75rem;" onclick="stopAllAudio()">⏹ Stop All</button>
            </div>
            
            <button class="btn-cyan" style="width: 100%; font-size: 0.92rem;" onclick="playExtendedFX('theme')">🎵 Play 6s B.O.B. Theme Soundtrack</button>

            <div class="btn-grid">
                <button class="btn-blue" onclick="playExtendedFX('boot')">⚡ 5s System Boot-Up</button>
                <button class="btn-amber" onclick="playExtendedFX('compute')">⚙️ 5s Heavy Computing</button>
                <button class="btn-green" onclick="playExtendedFX('radar')">📡 5s Deep Radar Scan</button
